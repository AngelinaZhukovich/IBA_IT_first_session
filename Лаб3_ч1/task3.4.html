<body>
    <h1>Каскадные таблицы стилей</h1> 
    <p>Каскадные таблицы стилей позволяют оформлять не только тексты и изображения, но и различные таблицы.</p> 
    
    <h2>Оформление изображений</h2> 
    
    <div class="frame"> 
        <div class="left"></div> 
        <div class="right"></div> 
    </div>
    
    <h2>Оформление таблиц</h2> 
    <table> 
        <tr> 
            <th>Фамилия</th> 
            <th>Адрес</th> 
            <th>Телефон</th> 
        </tr> 
        <tr> 
            <td>Иванов</td> 
            <td>Ленина, 8</td> 
            <td>1231212</td> 
        </tr> 
        <tr> 
            <td>Петров</td>
            <td>Суворова, 2</td> 
            <td>5556473</td> 
        </tr> 
        </tbody>
    </table>
</body>
</html>
