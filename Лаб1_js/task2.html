<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <title>Функции JavaScript</title>

    <style>
        body{
            margin:40px;
            font-family: Arial, sans-serif;
        }

        .block{
            width: 500px;
            border: 2px solid #ddd;
            padding: 20px;
            margin-bottom: 30px;
        }

        #mes{
            font-size: 32px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<h2>Проектирование и разработка web-приложений, 2024</h2>


<div class="block">
    <p id="mes">Здесь выводим сообщение</p>

    <button class="btn btn-secondary"
            onclick="showMessage('Работает обычная функция')">
        Сообщение
    </button>

    <button class="btn btn-primary"
            onclick="showArrow('Салют из стрелочной функции ES6')">
        Сообщение в формате ES6
    </button>
</div>

<script>

    // Обычная функция
    function showMessage(message){
        const text = document.getElementById("mes");

        text.innerHTML = message;
        text.style.color = "green";
    }

    // Стрелочная функция ES6
    const showArrow = (message) => {
        const text = document.getElementById("mes");

        text.innerHTML = message;
        text.style.color = "red";
    }

</script>

</body>
</html>
