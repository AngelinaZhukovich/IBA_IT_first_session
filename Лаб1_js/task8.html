<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задание 8 DOM</title>
</head>
<body>

<div>Пользователи:</div>

<ul>
    <li>Маша</li>
    <li>Вовочка</li>
</ul>

<script>

    // Получить элемент <div>
    let div = document.body.firstElementChild;

    // Получить элемент <ul>
    let ul = document.body.children[1];

    // Получить второй <li> (Вовочка)
    let li = ul.lastElementChild;

    // Вывод в консоль как на фото
    console.log(div);
    console.log(ul);
    console.log(li);
    </script>

</body>
</html>
