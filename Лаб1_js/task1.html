<!DOCTYPE html>
<html lang="ru">

  <meta charset="UTF-8">
  <title>Задание 1</title>

<body>

<script>
// Вычисления по заданию
const expr1 = (48 / (3 * Math.PI) + 308 / (4 * Math.E)) ** 2 - 203 * Math.sin(5)
            + (10 * Math.PI - 3 * Math.E) ** 3;

const expr2 = (Math.cos(20) - Math.cos(3) + Math.tan(5)) ** 2 - 203 / Math.sin(2);   

const expr3 = (22 * Math.PI / (22 * Math.E) - Math.sin(3) * Math.tan(4) - 34) ** 10;

// Округление
const r1 = expr1.toFixed(2);
const r2 = expr2.toFixed(2);
const r3 = expr3.toFixed(2);

// Минимальное значение
const minValue = Math.min(expr1, expr2, expr3).toFixed(2);


document.write("(48/3π + 308/4e)² - 203sin(5) + (10π - 3e)³ = " + r1 + "<br>");
document.write("(cos(20) - cos(3) + tan(5))² - 203/sin(2) = " + r2 + "<br>");
document.write("(22π/22e - sin(3)*tan(4) - 34)¹⁰ = " + r3 + "<br><br>");

document.write("Наименьший результат вычислений = " + minValue);
</script>

</body>
</html>
