<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задание 9 — DOM</title>

    <style>
        table {
            border-collapse: collapse; /* одна линия */
        }
        td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
            /* width: 40px;
            height: 40px; */
        }
    </style>
</head>
<body>

<table id="table">
    <tr>
        <td>1:1</td><td>1:2</td><td>1:3</td><td>1:4</td><td>1:5</td>
    </tr>
    <tr>
        <td>2:1</td><td>2:2</td><td>2:3</td><td>2:4</td><td>2:5</td>
    </tr>
    <tr>
        <td>3:1</td><td>3:2</td><td>3:3</td><td>3:4</td><td>3:5</td>
    </tr>
    <tr>
        <td>4:1</td><td>4:2</td><td>4:3</td><td>4:4</td><td>4:5</td>
    </tr>
    <tr>
        <td>5:1</td><td>5:2</td><td>5:3</td><td>5:4</td><td>5:5</td>
    </tr>
</table>

<script>
    let table = document.getElementById("table");

    for (let i = 0; i < table.rows.length; i++) {
        let td = table.rows[i].cells[i];
        td.style.backgroundColor = "red";
    }
</script>

</body>
</html>
