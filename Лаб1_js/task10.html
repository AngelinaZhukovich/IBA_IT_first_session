<body>

<script>

    // Получаем информацию о браузере
    let userAgent = navigator.userAgent;

    // Проверка Chrome
    if (userAgent.includes("Chrome")) {

        // Переход на Яндекс
        window.location.href = "https://www.ya.ru";

    } else {

        // Переход на Google
        window.location.href = "https://www.google.by";

    }

</script>

</body>
