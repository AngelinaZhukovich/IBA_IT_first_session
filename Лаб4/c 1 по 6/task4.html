<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>

        function fun1() {
           let i=1;
           while (i<11){
            document.write (i+'</br>');
            i++;
        }
        }

        function fun2() {
            for (let i=100; i>=0; i-=10){
                document.write (i+'</br>');
                
            }

           
        }

        function fun3() {
            for (let i=40; i>=0; i-=5){

                if(i==25) {
                    continue;
                };
                document.write (i+'</br>');
                
            }
           
        }

    </script>
</head>

<body>
    <p>Исправьте ошибки в коде так, чтобы после нажатия на каждую из кнопок ниже выполнялась соответствующая функция. </p>
        
    <input onclick="fun1()" type='button' value='Вывести числа от 1 до 10'/>
    <input onclick="fun2()" type='button' value='Вывести числа от 100 до 0 с шагом 10'/>
    <input onclick="fun3()" type='button' value='Вывести числа от 40 до 0 с шагом 5 пропустив 25'/>

    

</body>
</html>
