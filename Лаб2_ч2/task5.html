<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 5</title>
    <style> 
         body {
      margin: 0;
      font-family: Arial, sans-serif;
    }
    .outer {
      border: 4px solid green;
      padding: 10px;
      width: 500px;
      margin-left: auto;
      margin-right: auto;
      margin-top: 40px;
    }
    .row {
      display: flex;
      margin-bottom: 10px;
    }
    .section {
      border: 3px solid red;
      flex: 1;
      margin: 5px;
      padding: 5px;
      display: flex;
      flex-wrap: wrap;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      margin-bottom: 20px;
    }
    .block-blue {
      border: 3px solid blue;
      flex: 1;
      margin: 5px;
      padding: 3px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    .block-yellow {
      border: 3px solid yellow;
      flex: 1;
      margin: 1px;
      padding: 5px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    .column {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    </style> 
</head>
<body>
    <div class="outer">
         <!-- Верхний ряд --> 
        <div class="row"> 
            <div class="section"> 
                <div class="block-blue"></div>
                <div class="block-blue"></div> 
                <div class="block-blue"> 
                    <div> 
                        <div class="block-yellow" ></div> 
                        <div class="block-yellow"></div> 
                    </div>
                </div> 
            </div> 
        </div> 
            
            <!-- Ряд из четырёх --> 
            <div class="section"> 
                
                    <div class="block-blue" style="padding: 7px; margin: 2px;"></div> 
                    <div class="block-blue" style="padding: 7px; margin: 2px;"></div> 
                    <div class="block-blue" style="padding: 7px; margin: 2px;"></div> 
                    <div class="block-blue" style="padding: 7px; margin: 2px;"></div> 
                
            </div> 
            
            <!-- Центральная часть --> 
            <div class="section"> 
                 
                    <div class="block-blue"></div> 
                    <div class="block-blue" style="flex:2; height: 200px;">
                        <div class="column" style="flex:1; height: 200px;"> 
                            <div class="block-yellow" style="flex:7;"></div> 
                            <div class="block-yellow" style="margin-top: 10px;" ></div> 
                        </div> 
                    </div>  
                
            </div> 
            
            <div class="section" style="margin-bottom: 0px;"> 

                    <div class="block-blue" style="flex:1;">
                        <div class="block-yellow"></div> 
                        <div class="block-yellow"></div> 
                    </div> 
                    <div class="block-blue" style="flex:1;"></div> 
                    <div class="block-blue" style="flex:1;"></div> 
                 
            </div> 
            

</body>
</html>
