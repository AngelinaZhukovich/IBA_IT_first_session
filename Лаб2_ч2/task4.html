<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 4</title>
    <style>
        html, body 
        { height: 100%; 
            margin: 0; 
        }

        .header { 
            width: 100%; 
            height: 100px; 
            background: green; 
        }

        .menu { 
            float: left; 
            width: 200px; 
            height: calc(100% - 180px); 
            background: yellow; 
        } 
            
        .content { 
            float: left; 
            width: calc(100% - 200px); 
            height: calc(100% - 180px); 
            background: blue;   
        } 
            
        .footer { clear: both; 
            width: 100%; 
            height: 80px; 
            background: red;
        }
    </style>
</head>
<body>
    <div class="header">Header</div>
    <div class="menu">Menu</div>
    <div class="content">Content</div>
    <div class="footer">Footer</div>
</body>
</html>
