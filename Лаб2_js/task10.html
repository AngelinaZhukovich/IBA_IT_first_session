<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>

<script>
$(document).ready(function(){

    // массив id абзацев
    let ids = ["#p_1", "#p_2", "#p_3"];

    // случайный индекс 0–2
    let rand = Math.floor(Math.random() * ids.length);

    // получаем текст выбранного абзаца
    let text = $(ids[rand]).text();

    // выводим в alert
    alert(text);

});
</script>

</head>
<body>

<p id="p_1">text-1</p>
<p id="p_2">text-2</p>
<p id="p_3">text-3</p>

</body>
</html>
