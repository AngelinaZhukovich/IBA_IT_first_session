<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.5/jquery.min.js"></script>

<script>
$(document).ready(function(){

    $("button").click(function(){

        // перебираем все div с картинками
        $("div").each(function(index){

            // если индекс нечётный (1,3,5) — это чётные картинки
            if(index % 2 == 1){
                // выполняем slideToggle под соответствующий верхний div
                $(this).slideToggle("slow");
            }

        });

    });

});
</script>

</head>
<body>

<button>Кнопка</button><br/><br/>

<div><img src="/images/brazilia.jpg" width="250" height="125"/></div>
<div><img src="/images/britain.jpg"  width="250" height="125"/></div>
<div><img src="/images/germany.jpg"  width="250" height="125"/></div>
<div><img src="/images/france.jpg"   width="250" height="125"/></div>
<div><img src="/images/canada.jpg"   width="250" height="125"/></div>
<div><img src="/images/cheh.jpg"     width="250" height="125"/></div>

</body>
</html>
