<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 5_Form_Petrov</title>
    <style>
        p {
            font-weight: bold;
            margin: 0;
        }
        .block {
            width: 400px;
            margin-left: auto;
            margin-right: auto;
            border: 1px solid black;
            padding: 10px;
            background-color: #cbcbcb;
        }

        .nameLable {
            text-align: center;
            color: rgb(202, 48, 48);
            font-weight: bold;
            margin: 0;
            font-size: 6;
        }
    </style>

</head>
<body style="background-color: lightyellow;">

        <img src="/images/Sharm.png" alt="logo" style="width: 100px; display: block; margin: 0 auto;">   
<div class="block">
    <form>
        <p class="nameLable">Сотрудник принявший заказ</p> <br>

        <div style="margin-left: 120px; font-weight: bold;">
            <label for="employee">Фамилия сотрудника:</label> <br>
            <input type="text" id="employee" name="employee" style="width: 100px;" value="Петров" readonly><br>
        </div>
        
        <br>

        <p>Иностранные языки:</p>
            <input type="checkbox"name="language" value="1"> Английский <br>
            <input type="checkbox"name="language" value="2" disabled> Немецкий <br>
            <input type="checkbox"name="language" value="3"> Испанский <br>
            <br> 
        
        <p>Пол:</p>
            <label for="male">М</label> 
            <input type="radio" id="male" name="gender" value="male">
            <label for="female" >Ж</label> 
            <input type="radio" id="female" name="gender" value="female" disabled>

            <br> <br>

            <label for="employee">Дополнительные сведения:</label> <br>
            <textarea name="comment" id="wishes" rows="10" cols="45" disabled>Мужские фотосессии в Минске ориентированы на создание брутальных, деловых или повседневных образов. Работаю в студии.
            </textarea>

    </form>
 </div> 
</body>
</html>
