
<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<title></title>
<style>

h2 {
    text-align: center; 
    color: rgb(101, 8, 8);   
    margin: 10px;
}

.block{
    text-align: left;
    width: 290px;
    background-color: #decc0b;
    padding: 5px 0 5px 15px;
    margin: auto;
    border: 1px solid black;
}

.height {
    margin-top: 10px;
}

.inputSize{
    height: 22px;
    width: 140px;
    margin-right: 10px;
}

    

.buttonSend{
margin-left: 10px;
border-radius: 8px;
padding: 9px 22px;
cursor: pointer;
background-color: rgb(184, 170, 170);
margin-bottom: 10px;
margin-left: 40px;
}

.bottons {
margin-left: 10px;
margin-top: 10px;
border-radius: 8px;
padding: 10px 15px;
cursor: pointer;
background-color:rgb(184, 170, 170);
}

.text{
padding-left: 10px;
margin-left: 5px;
}

</style>
</head>

<body>
    <div class="block">
       <h2>Калькулятор</h2>

        <form>
            <input class="inputSize" type="number" id="firstNumber" name="firstNumber" >
            <label for="firstNumber">- Первое число</label><br>
            <input class="height inputSize" type="number" id="secondNumber" name="secondNumber" >
            <label for="secondNumber">- Второе число</label><br>
            <input class="height inputSize" type="number" id="result" name="result" >
            <label for="result">- Результат</label> <br>

            <input class="bottons" type="button" style="margin-left: 0;" value="+" onClick="result.value = firstNumber.valueAsNumber + secondNumber.valueAsNumber">
            <input class="bottons" type="button" value="-" onClick="result.value = firstNumber.value - secondNumber.value">
            <input class="bottons" type="button" value="*" onClick="result.value = firstNumber.value * secondNumber.value">
            <input class="bottons" type="button" value="/" onClick="result.value = firstNumber.value / secondNumber.value"> 
            <br>

            <input class="buttonSend height" type="reset" value="Очистить">
        </form>
    </div>
</body>
</html>
