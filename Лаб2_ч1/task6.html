
<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<title></title>
<style>

.formDiv{
text-align: left;
height: 260px;
width: 300px;
background-color: #FF7F50;
padding: 5px 0 5px 15px;
margin: auto;
}
.langDiv {
padding-left: 20px;
}
.button{
height: 30px;
width: 30px;
}
.text{
padding-left: 10px;
margin-left: 5px;
}

</style>
</head>
<!-- Зделал через таблицу. Сделать через div d-->
<body>
<div class="formDiv">
<h3 align="center"><font color="#FFD700">Калькулятор</font></h3>
<form name="calculator">
<input type="number" id="firstNumber" name="firstNumber" size="10">
<!-- При type="number" сложение происходит. При type="text" результат NaN-->
<label for="firstNumber">- Первое число</label><br><br>
<input type="number" id="secondNumber" name="secondNumber" size="10">
<label for="secondNumber">- Второе число</label><br><br>
<input type="text" id="result" name="result" size="10">
<label for="result">- Результат</label><br><br>
<input class="button" type="button" value="+" onClick="result.value = firstNumber.valueAsNumber + secondNumber.valueAsNumber">
<!-- При отсутствии .valueAsNumber и type="text" происходит склеивание значение, а не складывание-->
<input class="button" type="button" value="-" onClick="result.value = firstNumber.value - secondNumber.value">
<input class="button" type="button" value="*" onClick="result.value = firstNumber.value * secondNumber.value">
<input class="button" type="button" value="/" onClick="result.value = firstNumber.value / secondNumber.value">
<p>
<input type="reset" value="Очистить">
</p>
</form>
</div>
</body>
</html>
