<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 33</title>
    <style>
        @keyframes moveElevator {
        100%{ top: 150px; }
        50%{ top: 0px; }
        0% { top: -150px; }
        
        
}
    </style>
</head>
<body>
    <table style="margin: 50px; border: none; border-collapse: collapse;">
        <tr>
            <td>
                <img src="/images/openWindow.jpg" alt="openWindow" height="150px" width="250px">
            </td>
            <td rowspan="3" style="position: relative; animation: moveElevator 4s infinite alternate;">
               
                <img src="/images/elevator.jpg" alt="elevator" height="150px">
               
            </td>
            <td><img src="/images/closeWindow.jpg" alt="openWindow" height="150px" width="250px"></td>
        </tr>
        <tr>
            <td><img src="/images/closeWindow.jpg" alt="openWindow" height="150px" width="250px"></td>
            <td><img src="/images/openWindow.jpg" alt="openWindow" height="150px" width="250px"></td>
            
        </tr>
        <tr>
            <td><img src="/images/openWindow.jpg" alt="openWindow" height="150px" width="250px"></td>
            <td><img src="/images/closeWindow.jpg" alt="openWindow" height="150px" width="250px"></td>
        </tr>
    </table>
</body>
</html>
